name: Direct tests

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GENVM_VERSION: v0.6.0-rc8
  GENVM_ALLOW_PRERELEASE: "1"

jobs:
  direct-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: genvm-lint check contract/remediate.py --json
      - run: python -m pytest tests/direct tests/unit -q -rs
